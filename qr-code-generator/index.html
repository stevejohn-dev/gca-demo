<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL QR Code Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
</head>
<body class="bg-base-200 text-base-content min-h-screen flex flex-col items-center justify-center p-4">
    <div class="card w-full max-w-md bg-base-100 shadow-xl p-6 space-y-4">
        <h1 class="card-title text-2xl font-bold text-center">URL QR Code Generator</h1>

        <div class="form-control">
            <label class="label">
                <span class="label-text">Enter URL:</span>
            </label>
            <input type="url" id="urlInput" placeholder="https://example.com" class="input input-bordered w-full" />
        </div>

        <div class="flex justify-center space-x-2">
            <button id="generateBtn" class="btn btn-primary">Generate QR Code</button>
            <button id="clearBtn" class="btn btn-secondary">Clear</button>
            <div class="dropdown dropdown-end">
                <div tabindex="0" role="button" class="btn">Settings</div>
                <ul tabindex="0" class="dropdown-content z-[1] menu p-2 shadow bg-base-100 rounded-box w-52">
                    <li>
                        <label class="label cursor-pointer">
                            <span class="label-text">Size:</span>
                            <select id="qrSize" class="select select-bordered select-sm">
                                <option value="100">100x100</option>
                                <option value="200" selected>200x200</option>
                                <option value="300">300x300</option>
                            </select>
                        </label>
                    </li>
                    <li>
                        <label class="label cursor-pointer">
                            <span class="label-text">Error Correction:</span>
                            <select id="qrLevel" class="select select-bordered select-sm">
                                <option value="L">Low</option>
                                <option value="M" selected>Medium</option>
                                <option value="Q">Quartile</option>
                                <option value="H">High</option>
                            </select>
                        </label>
                    </li>
                </ul>
            </div>
        </div>

        <div id="qrcodeContainer" class="flex justify-center mt-4">
            <!-- QR code will be rendered here -->
        </div>

        <div id="motivationalMessage" class="alert alert-success text-center mt-4 hidden">
            <!-- Motivational message will be displayed here -->
        </div>

        <div class="divider">Recent QR Codes</div>
        <div class="card bg-base-200 shadow-md p-4">
            <ul id="recentQRCodes" class="list-disc list-inside">
                <!-- Recent QR codes will be listed here -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
