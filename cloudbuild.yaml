steps:
  # 1. Build the container image using the Dockerfile in the qr-code-generator directory
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'
      - '.'
    dir: 'qr-code-generator'

  # 2. Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'push'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'

  # 3. Deploy the container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region'
      - '$_DEPLOY_REGION'
      - '--allow-unauthenticated'

# Define images to be pushed by Cloud Build
images:
  - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'

# Default substitutions (can be overridden in the Cloud Build Trigger settings)
substitutions:
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _AR_REPO_NAME: cloud-run-source-deploy
  _SERVICE_NAME: qr-code-generator
  _DEPLOY_REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY
